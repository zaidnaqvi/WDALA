<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Web Design Portfolio Showcase</title>

    <style>
      /* =====================================================
           RESET
        ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f6f8;
        color: #171717;
        overflow-x: hidden;
      }

      /* =====================================================
           ANIMATED GRID BACKGROUND
        ===================================================== */

      body::before {
        content: "";
        position: fixed;
        inset: 0;

        background-image:
          linear-gradient(rgba(17, 24, 39, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(17, 24, 39, 0.055) 1px, transparent 1px);

        background-size: 45px 45px;

        animation: gridMove 18s linear infinite;

        pointer-events: none;

        z-index: -3;
      }

      @keyframes gridMove {
        0% {
          background-position:
            0 0,
            0 0;
        }

        100% {
          background-position:
            45px 45px,
            45px 45px;
        }
      }

      /* =====================================================
           BACKGROUND GLOW
        ===================================================== */

      body::after {
        content: "";

        position: fixed;

        width: 500px;
        height: 500px;

        top: -180px;
        right: -150px;

        background: radial-gradient(
          circle,
          rgba(79, 70, 229, 0.13),
          transparent 70%
        );

        filter: blur(30px);

        animation: floatingGlow 7s ease-in-out infinite;

        pointer-events: none;

        z-index: -2;
      }

      @keyframes floatingGlow {
        0%,
        100% {
          transform: translate(0, 0);
        }

        50% {
          transform: translate(-50px, 40px);
        }
      }

      /* =====================================================
           HEADER
        ===================================================== */

      header {
        position: relative;

        background: #111827;

        color: white;

        padding: 90px 20px;

        text-align: center;

        overflow: hidden;
      }

      /* Header grid */

      header::before {
        content: "";

        position: absolute;

        inset: 0;

        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);

        background-size: 35px 35px;

        animation: headerGrid 12s linear infinite;

        pointer-events: none;
      }

      @keyframes headerGrid {
        from {
          transform: translate(0, 0);
        }

        to {
          transform: translate(35px, 35px);
        }
      }

      header h1 {
        position: relative;

        font-size: 48px;

        margin-bottom: 12px;

        animation: titleReveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        opacity: 0;

        transform: translateY(30px);
      }

      header p {
        position: relative;

        color: #b9c0cb;

        font-size: 17px;

        animation: subtitleReveal 0.9s 0.2s cubic-bezier(0.16, 1, 0.3, 1)
          forwards;

        opacity: 0;

        transform: translateY(20px);
      }

      @keyframes titleReveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes subtitleReveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* =====================================================
           CONTAINER
        ===================================================== */

      .container {
        width: min(1150px, calc(100% - 40px));

        margin: auto;
      }

      /* =====================================================
           FILTER SECTION
        ===================================================== */

      .filter-section {
        padding: 45px 0 20px;
      }

      .filters {
        display: flex;

        justify-content: center;

        flex-wrap: wrap;

        gap: 10px;
      }

      .filter-btn {
        border: 1px solid #d1d5db;

        background: rgba(255, 255, 255, 0.8);

        backdrop-filter: blur(10px);

        color: #374151;

        padding: 11px 20px;

        border-radius: 30px;

        cursor: pointer;

        font-size: 14px;

        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .filter-btn:hover {
        transform: translateY(-3px);

        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .filter-btn.active {
        background: #111827;

        color: white;

        border-color: #111827;

        transform: translateY(-2px);

        box-shadow: 0 8px 20px rgba(17, 24, 39, 0.2);
      }

      /* =====================================================
           PROJECT GRID
        ===================================================== */

      .projects {
        padding: 25px 0 80px;

        display: grid;

        grid-template-columns: repeat(3, minmax(0, 1fr));

        gap: 25px;
      }

      /* =====================================================
           PROJECT CARD
        ===================================================== */

      .project-card {
        background: rgba(255, 255, 255, 0.86);

        backdrop-filter: blur(10px);

        border-radius: 16px;

        overflow: hidden;

        border: 1px solid rgba(229, 231, 235, 0.9);

        opacity: 0;

        transform: translateY(35px) scale(0.97);

        animation: cardReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        transition:
          transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 0.4s,
          border-color 0.4s;
      }

      @keyframes cardReveal {
        to {
          opacity: 1;

          transform: translateY(0) scale(1);
        }
      }

      .project-card:hover {
        transform: translateY(-10px) scale(1.015);

        box-shadow: 0 25px 55px rgba(0, 0, 0, 0.11);

        border-color: rgba(79, 70, 229, 0.25);
      }

      /* =====================================================
           PROJECT IMAGE
        ===================================================== */

      .project-image {
        width: 100%;

        height: 220px;

        object-fit: cover;

        display: block;

        transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .project-card:hover .project-image {
        transform: scale(1.07);
      }

      /* =====================================================
           PROJECT CONTENT
        ===================================================== */

      .project-content {
        padding: 22px;
      }

      .project-category {
        display: inline-block;

        font-size: 12px;

        font-weight: bold;

        color: #4f46e5;

        background: #eef2ff;

        padding: 5px 9px;

        border-radius: 20px;

        margin-bottom: 12px;

        transition: transform 0.3s;
      }

      .project-card:hover .project-category {
        transform: translateX(4px);
      }

      .project-content h3 {
        font-size: 21px;

        margin-bottom: 8px;
      }

      .project-content p {
        color: #6b7280;

        line-height: 1.6;

        font-size: 14px;

        margin-bottom: 15px;
      }

      /* =====================================================
           TAGS
        ===================================================== */

      .tags {
        display: flex;

        flex-wrap: wrap;

        gap: 6px;

        margin-bottom: 18px;
      }

      .tag {
        background: #f3f4f6;

        color: #4b5563;

        padding: 5px 9px;

        border-radius: 5px;

        font-size: 11px;

        transition:
          transform 0.25s,
          background 0.25s;
      }

      .tag:hover {
        transform: translateY(-2px);

        background: #e5e7eb;
      }

      /* =====================================================
           VIEW BUTTON
        ===================================================== */

      .view-btn {
        width: 100%;

        border: none;

        background: #111827;

        color: white;

        padding: 12px;

        border-radius: 8px;

        cursor: pointer;

        position: relative;

        overflow: hidden;

        transition:
          transform 0.3s,
          background 0.3s,
          box-shadow 0.3s;
      }

      .view-btn::before {
        content: "";

        position: absolute;

        top: 0;
        left: -100%;

        width: 100%;
        height: 100%;

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.15),
          transparent
        );

        transition: left 0.5s;
      }

      .view-btn:hover::before {
        left: 100%;
      }

      .view-btn:hover {
        background: #374151;

        transform: translateY(-2px);

        box-shadow: 0 10px 25px rgba(17, 24, 39, 0.2);
      }

      /* =====================================================
           MODAL
        ===================================================== */

      .modal {
        position: fixed;

        inset: 0;

        background: rgba(0, 0, 0, 0.78);

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 20px;

        z-index: 1000;

        opacity: 0;

        visibility: hidden;

        transition:
          opacity 0.3s,
          visibility 0.3s;
      }

      .modal.active {
        opacity: 1;

        visibility: visible;
      }

      .modal-content {
        background: white;

        width: min(850px, 100%);

        max-height: 90vh;

        overflow-y: auto;

        border-radius: 18px;

        position: relative;

        transform: translateY(35px) scale(0.94);

        opacity: 0;

        transition:
          transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.35s;
      }

      .modal.active .modal-content {
        transform: translateY(0) scale(1);

        opacity: 1;
      }

      /* =====================================================
           SLIDER
        ===================================================== */

      .slider {
        position: relative;

        width: 100%;

        height: 420px;

        background: #111827;

        overflow: hidden;

        border-radius: 18px 18px 0 0;
      }

      .slider img {
        width: 100%;

        height: 100%;

        object-fit: cover;

        display: block;

        animation: sliderReveal 0.45s ease;
      }

      @keyframes sliderReveal {
        from {
          opacity: 0;

          transform: scale(1.04);
        }

        to {
          opacity: 1;

          transform: scale(1);
        }
      }

      /* =====================================================
           SLIDER BUTTONS
        ===================================================== */

      .slider-btn {
        position: absolute;

        top: 50%;

        transform: translateY(-50%);

        width: 45px;

        height: 45px;

        border: none;

        border-radius: 50%;

        background: rgba(0, 0, 0, 0.65);

        color: white;

        font-size: 25px;

        cursor: pointer;

        transition:
          transform 0.3s,
          background 0.3s;
      }

      .slider-btn:hover {
        background: black;

        transform: translateY(-50%) scale(1.1);
      }

      .prev {
        left: 15px;
      }

      .next {
        right: 15px;
      }

      /* =====================================================
           SLIDER DOTS
        ===================================================== */

      .dots {
        position: absolute;

        bottom: 15px;

        left: 50%;

        transform: translateX(-50%);

        display: flex;

        gap: 7px;
      }

      .dot {
        width: 9px;

        height: 9px;

        border: none;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.5);

        cursor: pointer;

        transition:
          transform 0.25s,
          background 0.25s;
      }

      .dot:hover {
        transform: scale(1.4);
      }

      .dot.active {
        background: white;

        transform: scale(1.25);
      }

      /* =====================================================
           MODAL DETAILS
        ===================================================== */

      .modal-details {
        padding: 30px;

        animation: detailsReveal 0.6s 0.1s both;
      }

      @keyframes detailsReveal {
        from {
          opacity: 0;

          transform: translateY(15px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }

      .modal-details h2 {
        font-size: 30px;

        margin-bottom: 8px;
      }

      .modal-category {
        color: #4f46e5;

        font-size: 13px;

        font-weight: bold;

        margin-bottom: 15px;
      }

      .modal-details p {
        color: #6b7280;

        line-height: 1.7;

        margin-bottom: 20px;
      }

      .modal-tags {
        display: flex;

        flex-wrap: wrap;

        gap: 7px;
      }

      /* =====================================================
           CLOSE BUTTON
        ===================================================== */

      .close-modal {
        position: absolute;

        right: 15px;

        top: 15px;

        width: 42px;

        height: 42px;

        border: none;

        border-radius: 50%;

        background: rgba(0, 0, 0, 0.7);

        color: white;

        font-size: 22px;

        cursor: pointer;

        z-index: 5;

        transition:
          transform 0.3s,
          background 0.3s;
      }

      .close-modal:hover {
        background: black;

        transform: rotate(90deg) scale(1.08);
      }

      /* =====================================================
           NO RESULTS
        ===================================================== */

      .no-results {
        grid-column: 1 / -1;

        text-align: center;

        padding: 60px;

        color: #6b7280;

        animation: fadeIn 0.4s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      /* =====================================================
           RESPONSIVE
        ===================================================== */

      @media (max-width: 900px) {
        .projects {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 600px) {
        header {
          padding: 60px 20px;
        }

        header h1 {
          font-size: 34px;
        }

        .projects {
          grid-template-columns: 1fr;
        }

        .slider {
          height: 280px;
        }

        .modal-details {
          padding: 22px;
        }

        .modal-details h2 {
          font-size: 25px;
        }
      }

      /* =====================================================
           REDUCED MOTION
        ===================================================== */

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;

          animation-iteration-count: 1 !important;

          scroll-behavior: auto !important;

          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>
      <h1>My Web Design Portfolio</h1>

      <p>Explore my web design projects and creative work</p>
    </header>

    <!-- =====================================================
         FILTERS
    ===================================================== -->

    <section class="filter-section">
      <div class="container">
        <div class="filters" id="filters"></div>
      </div>
    </section>

    <!-- =====================================================
         PROJECTS
    ===================================================== -->

    <main class="container">
      <section class="projects" id="projects"></section>
    </main>

    <!-- =====================================================
         MODAL
    ===================================================== -->

    <div class="modal" id="projectModal">
      <div class="modal-content">
        <button class="close-modal" id="closeModal">×</button>

        <!-- IMAGE SLIDER -->

        <div class="slider">
          <img id="sliderImage" src="" alt="Project screenshot" />

          <button class="slider-btn prev" id="prevBtn">‹</button>

          <button class="slider-btn next" id="nextBtn">›</button>

          <div class="dots" id="sliderDots"></div>
        </div>

        <!-- PROJECT INFORMATION -->

        <div class="modal-details">
          <div class="modal-category" id="modalCategory"></div>

          <h2 id="modalTitle"></h2>

          <p id="modalDescription"></p>

          <div class="modal-tags" id="modalTags"></div>
        </div>
      </div>
    </div>

    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>
      /* =====================================================
           PROJECT DATA
        ===================================================== */

      const projects = [
        {
          id: 1,

          title: "Modern E-Commerce Website",

          category: "E-Commerce",

          description:
            "A modern responsive e-commerce website designed with a clean interface and user-friendly shopping experience.",

          tags: ["HTML", "CSS", "JavaScript", "E-Commerce"],

          images: [
            "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1556742111-a301076d9d18?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=1400&q=80",
          ],
        },

        {
          id: 2,

          title: "Creative Agency Website",

          category: "Business",

          description:
            "A professional agency website focused on strong typography, modern layouts and clear visual hierarchy.",

          tags: ["UI/UX", "HTML", "CSS", "Responsive"],

          images: [
            "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1400&q=80",
          ],
        },

        {
          id: 3,

          title: "Travel Landing Page",

          category: "Landing Page",

          description:
            "An engaging travel landing page featuring destination sections, attractive visuals and responsive design.",

          tags: ["HTML", "CSS", "JavaScript", "Landing Page"],

          images: [
            "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=80",
          ],
        },

        {
          id: 4,

          title: "Portfolio Website",

          category: "Portfolio",

          description:
            "A personal portfolio website designed to showcase creative projects, skills and web development work.",

          tags: ["Portfolio", "JavaScript", "CSS", "Responsive"],

          images: [
            "https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1559028012-481c04fa702d?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&w=1400&q=80",
          ],
        },

        {
          id: 5,

          title: "Restaurant Website",

          category: "Business",

          description:
            "A visually appealing restaurant website with menu sections, attractive imagery and a responsive layout.",

          tags: ["HTML", "CSS", "Restaurant", "UI Design"],

          images: [
            "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1400&q=80",
          ],
        },

        {
          id: 6,

          title: "Dashboard UI",

          category: "Dashboard",

          description:
            "A clean dashboard interface designed to present information through organized cards, statistics and navigation.",

          tags: ["Dashboard", "UI/UX", "JavaScript", "CSS"],

          images: [
            "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1543286386-713bdd548da4?auto=format&fit=crop&w=1400&q=80",

            "https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1400&q=80",
          ],
        },
      ];

      /* =====================================================
           DOM ELEMENTS
        ===================================================== */

      const projectsContainer = document.getElementById("projects");

      const filtersContainer = document.getElementById("filters");

      const modal = document.getElementById("projectModal");

      const closeModal = document.getElementById("closeModal");

      const sliderImage = document.getElementById("sliderImage");

      const prevBtn = document.getElementById("prevBtn");

      const nextBtn = document.getElementById("nextBtn");

      const sliderDots = document.getElementById("sliderDots");

      const modalTitle = document.getElementById("modalTitle");

      const modalCategory = document.getElementById("modalCategory");

      const modalDescription = document.getElementById("modalDescription");

      const modalTags = document.getElementById("modalTags");

      /* =====================================================
           STATE
        ===================================================== */

      let currentProject = null;

      let currentSlide = 0;

      let activeFilter = "All";

      /* =====================================================
           FILTER CATEGORIES
        ===================================================== */

      const categories = [
        "All",
        ...new Set(projects.map((project) => project.category)),
      ];

      categories.forEach((category) => {
        const button = document.createElement("button");

        button.className = "filter-btn";

        button.textContent = category;

        button.type = "button";

        if (category === "All") {
          button.classList.add("active");
        }

        button.addEventListener("click", () => {
          activeFilter = category;

          document
            .querySelectorAll(".filter-btn")
            .forEach((btn) => btn.classList.remove("active"));

          button.classList.add("active");

          displayProjects();
        });

        filtersContainer.appendChild(button);
      });

      /* =====================================================
           DISPLAY PROJECTS
        ===================================================== */

      function displayProjects() {
        projectsContainer.innerHTML = "";

        let filteredProjects = projects;

        if (activeFilter !== "All") {
          filteredProjects = projects.filter(
            (project) =>
              project.category === activeFilter ||
              project.tags.includes(activeFilter),
          );
        }

        if (filteredProjects.length === 0) {
          projectsContainer.innerHTML = `

                    <div class="no-results">

                        No projects found.

                    </div>

                `;

          return;
        }

        filteredProjects.forEach((project, index) => {
          const card = document.createElement("article");

          card.className = "project-card";

          /*
                     Stagger animation
                    */

          card.style.animationDelay = `${index * 0.08}s`;

          card.innerHTML = `

                        <img
                            class="project-image"
                            src="${project.images[0]}"
                            alt="${project.title}"
                        >


                        <div class="project-content">

                            <span class="project-category">

                                ${project.category}

                            </span>


                            <h3>

                                ${project.title}

                            </h3>


                            <p>

                                ${project.description}

                            </p>


                            <div class="tags">

                                ${project.tags
                                  .map(
                                    (tag) =>
                                      `
                                                <span class="tag">
                                                    ${tag}
                                                </span>
                                                `,
                                  )
                                  .join("")}

                            </div>


                            <button
                                class="view-btn"
                                type="button"
                            >

                                View Project

                            </button>

                        </div>

                    `;

          card
            .querySelector(".view-btn")
            .addEventListener("click", () => openProject(project));

          projectsContainer.appendChild(card);
        });
      }

      /* =====================================================
           OPEN PROJECT
        ===================================================== */

      function openProject(project) {
        currentProject = project;

        currentSlide = 0;

        modalTitle.textContent = project.title;

        modalCategory.textContent = project.category;

        modalDescription.textContent = project.description;

        modalTags.innerHTML = project.tags
          .map(
            (tag) =>
              `
                            <span class="tag">
                                ${tag}
                            </span>
                            `,
          )
          .join("");

        updateSlider();

        modal.classList.add("active");

        document.body.style.overflow = "hidden";
      }

      /* =====================================================
           UPDATE SLIDER
        ===================================================== */

      function updateSlider() {
        if (!currentProject) {
          return;
        }

        /*
             Restart image animation
            */

        sliderImage.style.animation = "none";

        sliderImage.offsetHeight;

        sliderImage.style.animation = "";

        sliderImage.src = currentProject.images[currentSlide];

        sliderDots.innerHTML = "";

        currentProject.images.forEach((image, index) => {
          const dot = document.createElement("button");

          dot.className = "dot";

          dot.type = "button";

          if (index === currentSlide) {
            dot.classList.add("active");
          }

          dot.addEventListener("click", () => {
            currentSlide = index;

            updateSlider();
          });

          sliderDots.appendChild(dot);
        });
      }

      /* =====================================================
           NEXT SLIDE
        ===================================================== */

      nextBtn.addEventListener("click", () => {
        if (!currentProject) {
          return;
        }

        currentSlide = (currentSlide + 1) % currentProject.images.length;

        updateSlider();
      });

      /* =====================================================
           PREVIOUS SLIDE
        ===================================================== */

      prevBtn.addEventListener("click", () => {
        if (!currentProject) {
          return;
        }

        currentSlide =
          (currentSlide - 1 + currentProject.images.length) %
          currentProject.images.length;

        updateSlider();
      });

      /* =====================================================
           CLOSE MODAL
        ===================================================== */

      function closeProject() {
        modal.classList.remove("active");

        document.body.style.overflow = "";

        currentProject = null;
      }

      closeModal.addEventListener("click", closeProject);

      /* =====================================================
           CLOSE ON BACKGROUND CLICK
        ===================================================== */

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeProject();
        }
      });

      /* =====================================================
           KEYBOARD CONTROLS
        ===================================================== */

      document.addEventListener("keydown", (event) => {
        if (!currentProject) {
          return;
        }

        if (event.key === "Escape") {
          closeProject();
        }

        if (event.key === "ArrowRight") {
          nextBtn.click();
        }

        if (event.key === "ArrowLeft") {
          prevBtn.click();
        }
      });

      /* =====================================================
           INITIALIZE
        ===================================================== */

      displayProjects();
    </script>
  </body>
</html>
